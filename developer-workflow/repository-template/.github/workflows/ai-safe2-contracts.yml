name: AI SAFE2 Contract Validation

on:
  pull_request:
    paths:
      - ".ai-safe2/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/validate_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: python -m pip install "jsonschema==4.25.1"

      - name: Validate workflow configuration
        run: python scripts/validate_workflow.py --root .

      - name: Explain authority boundary
        run: echo "Validation supplies evidence. A named human still decides whether to merge or release." >> "$GITHUB_STEP_SUMMARY"

