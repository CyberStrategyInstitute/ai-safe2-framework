name: AI SAFE² Skill Trust Gate

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'examples/**/SKILL.md'
      - 'examples/**/SKILL-CARD.md'
      - '**/*.skill.md'
      - '!examples/skill-trust-gate/test-fixtures/**'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '!examples/skill-trust-gate/test-fixtures/**'
  workflow_dispatch:
    inputs:
      skill_path:
        description: 'Path to skill directory to scan'
        required: true
        type: string
      strict_mode:
        description: 'Enable strict mode'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: trust-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SCANNER_VERSION: "1.1.0"
  FRAMEWORK_VERSION: "v3.1"

jobs:
  discover-skills:
    name: Discover Changed Skills
    runs-on: ubuntu-latest
    outputs:
      skill_paths: ${{ steps.find-skills.outputs.paths }}
      has_skills: ${{ steps.find-skills.outputs.has_skills }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed skill directories
        id: find-skills
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SKILL_PATH: ${{ github.event.inputs.skill_path }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 -c 'import json, os; print("paths=" + json.dumps([os.environ["DISPATCH_SKILL_PATH"]]))' >> "$GITHUB_OUTPUT"
            echo "has_skills=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZERO_SHA="0000000000000000000000000000000000000000"
          if [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$ZERO_SHA" ]]; then
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" HEAD)
          elif [[ -n "$BASE_REF" ]]; then
            CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || find . -name 'SKILL.md' -not -path './.git/*' | head -20)
          fi

          SKILL_DIRS=$(echo "$CHANGED_FILES" | \
            grep -E 'SKILL\.md|SKILL-CARD\.md' | \
            grep -v 'examples/skill-trust-gate/test-fixtures/' | \
            xargs -r -I{} dirname {} | sort -u | \
            python3 -c "import sys,json; paths=[l.strip() for l in sys.stdin if l.strip()]; print(json.dumps(paths))")

          if [[ -z "$SKILL_DIRS" || "$SKILL_DIRS" == "[]" ]]; then
            echo "has_skills=false" >> "$GITHUB_OUTPUT"
            echo "paths=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_skills=true" >> "$GITHUB_OUTPUT"
            echo "paths=$SKILL_DIRS" >> "$GITHUB_OUTPUT"
          fi

  static-trust-gate:
    name: Static Trust Gate Scan
    runs-on: ubuntu-latest
    needs: discover-skills
    if: needs.discover-skills.outputs.has_skills == 'true'
    strategy:
      matrix:
        skill_path: ${{ fromJson(needs.discover-skills.outputs.skill_paths) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Run static trust gate scan
        id: scan
        env:
          SKILL_PATH: ${{ matrix.skill_path }}
          STRICT_MODE: ${{ github.event.inputs.strict_mode }}
        run: |
          SKILL_NAME=$(basename "$SKILL_PATH")
          SKILL_NAME_SAFE=$(echo "$SKILL_NAME" | tr -cd '[:alnum:]._-')
          REPORT_PREFIX="trust-gate-${SKILL_NAME_SAFE}-$(date +%Y%m%d)"
          echo "skill_name=$SKILL_NAME_SAFE" >> "$GITHUB_OUTPUT"
          echo "report_prefix=$REPORT_PREFIX" >> "$GITHUB_OUTPUT"

          STRICT_FLAG=""
          if [[ "$STRICT_MODE" == "true" ]]; then STRICT_FLAG="--strict"; fi

          SCAN_EXIT=0
          python scripts/skill_trust_gate.py "$SKILL_PATH" \
            --output both --report "$REPORT_PREFIX" --no-color \
            $STRICT_FLAG || SCAN_EXIT=$?
          echo "scan_exit=$SCAN_EXIT" >> "$GITHUB_OUTPUT"

          if [ -f "${REPORT_PREFIX}.json" ]; then
            DECISION=$(python3 -c "import json; d=json.load(open('${REPORT_PREFIX}.json')); print(d['decision'])")
            SEVERITY=$(python3 -c "import json; d=json.load(open('${REPORT_PREFIX}.json')); print(d['severity'])")
            AISM=$(python3 -c "import json; d=json.load(open('${REPORT_PREFIX}.json')); print(d['aism_level'])")
          else
            DECISION="HOLD FOR REVIEW"
            SEVERITY="UNKNOWN"
            AISM="UNKNOWN"
          fi
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "severity=$SEVERITY" >> "$GITHUB_OUTPUT"
          echo "aism=$AISM" >> "$GITHUB_OUTPUT"

      - name: Validate SKILL-CARD.md
        id: validate
        if: always()
        env:
          SKILL_PATH: ${{ matrix.skill_path }}
        run: |
          SKILL_CARD="${SKILL_PATH}/SKILL-CARD.md"
          if [ -f "$SKILL_CARD" ]; then
            python scripts/validate_skill_card.py "$SKILL_CARD" --json > skill-card-validation.json 2>&1 || true
            VALID=$(python3 -c "import json; d=json.load(open('skill-card-validation.json')); print(str(d.get('valid', False)).lower())" 2>/dev/null || echo "false")
            COMPLETENESS=$(python3 -c "import json; d=json.load(open('skill-card-validation.json')); print(d.get('completeness_score', 0))" 2>/dev/null || echo "0")
          else
            VALID=false
            COMPLETENESS=0
          fi
          echo "card_valid=$VALID" >> "$GITHUB_OUTPUT"
          echo "completeness=$COMPLETENESS" >> "$GITHUB_OUTPUT"

      - name: Upload scan report artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trust-gate-report-${{ steps.scan.outputs.skill_name }}
          path: |
            trust-gate-*.json
            trust-gate-*.md
            skill-card-validation.json
          retention-days: 90

      - name: Post PR trust decision
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          DECISION: ${{ steps.scan.outputs.decision }}
          SEVERITY: ${{ steps.scan.outputs.severity }}
          AISM: ${{ steps.scan.outputs.aism }}
          SKILL_NAME: ${{ steps.scan.outputs.skill_name }}
          CARD_VALID: ${{ steps.validate.outputs.card_valid }}
          COMPLETENESS: ${{ steps.validate.outputs.completeness }}
        with:
          script: |
            const { DECISION, SEVERITY, AISM, SKILL_NAME, CARD_VALID, COMPLETENESS } = process.env;
            const body = [
              '## AI SAFE² Skill Trust Gate Report', '',
              `**Skill:** \`${SKILL_NAME}\``,
              `**Decision:** **${DECISION}**`,
              `**Severity:** ${SEVERITY}`,
              `**AISM Level:** ${AISM}`,
              `**SKILL-CARD Valid:** ${CARD_VALID === 'true' ? 'yes' : 'no'} (${COMPLETENESS}% complete)`,
              '', `Framework: AI SAFE² ${process.env.FRAMEWORK_VERSION || 'v3.1'}`,
              `Scanner: Skill Trust Gate v${process.env.SCANNER_VERSION || '1.1.0'}`
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Enforce decision
        if: steps.scan.outputs.decision == 'REJECT' || steps.scan.outputs.decision == 'HOLD FOR REVIEW' || steps.validate.outputs.card_valid != 'true'
        env:
          SKILL_PATH: ${{ matrix.skill_path }}
          DECISION: ${{ steps.scan.outputs.decision }}
          CARD_VALID: ${{ steps.validate.outputs.card_valid }}
        run: |
          echo "Trust gate blocked: $SKILL_PATH"
          echo "Decision: $DECISION"
          echo "SKILL-CARD valid: $CARD_VALID"
          exit 1

  trust-gate-summary:
    name: Trust Gate Summary
    runs-on: ubuntu-latest
    needs: [discover-skills, static-trust-gate]
    if: always() && needs.discover-skills.outputs.has_skills == 'true'
    steps:
      - name: Evaluate gate results
        env:
          SCAN_RESULT: ${{ needs.static-trust-gate.result }}
        run: |
          if [[ "$SCAN_RESULT" == "failure" ]]; then
            echo "One or more skills failed or lacked complete trust evidence."
            exit 1
          fi
          echo "All changed skills passed the v3.1 trust gate."
