name: PR-Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Keep unrelated PR comments from cancelling an active review. Only pull-request
  # events and explicit /review commands share the review concurrency lane.
  group: >-
    pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{
      github.event_name == 'issue_comment' &&
      !startsWith(github.event.comment.body, '/review') &&
      github.run_id || 'review'
    }}
  cancel-in-progress: true

jobs:
  review:
    name: PR-Agent / Advisory availability
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_AGENT_FREE_MODEL_POOL: '["stealth/space-bunny-alpha","qwen/qwen3.8-27b:free","poolside/laguna-s-2.1:free","cohere/north-mini-code:free","nvidia/nemotron-3-ultra-550b-a55b:free","nvidia/nemotron-3.5-lightning:free","nvidia/nemotron-3-super-120b-a12b:free","nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"]'
      PR_AGENT_FALLBACK_MODELS: '["gpt-5.6-luna"]'
      PR_AGENT_OPENAI_FALLBACK_MODEL: gpt-5.6-luna
      PR_AGENT_REQUEST_TIMEOUT_SECONDS: "75"
      PR_AGENT_FREE_MAX_MODEL_TOKENS: "16000"
      PR_AGENT_FREE_MAX_CALLS: "1"
      PR_AGENT_OPENAI_MAX_MODEL_TOKENS: "64000"
      PR_AGENT_SOURCE_COMMIT: 1d01f24f455bb879c1d9c557ad7de3d72dcc7975
    steps:
      - name: Check out review policy and preflight
        uses: actions/checkout@v7
        with:
          # issue_comment workflows are loaded from the default branch. Explicitly
          # bind scripts and repository policy to the PR revision being reviewed.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select proportionate review route
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: >-
          python scripts/classify_pr_change.py
          --base "$BASE_SHA" --head HEAD
          --labels-json "$LABELS_JSON"
          --json-output change-route.json
          --markdown-output change-route.md

      - name: Explain skipped AI review
        if: steps.route.outputs.route != 'solution'
        shell: bash
        run: cat change-route.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record review attempt start
        if: steps.route.outputs.route == 'solution'
        id: attempt
        shell: bash
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Select an available free review model
        id: preflight
        if: steps.route.outputs.route == 'solution'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: >-
          python scripts/pr_agent_preflight.py
          --policy .ai-safe2/pr-agent-preflight-policy.json
          --receipt pr-agent-preflight.json

      - name: Set up Python for PR-Agent
        if: steps.route.outputs.route == 'solution'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned PR-Agent source
        if: steps.route.outputs.route == 'solution'
        timeout-minutes: 3
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          "pr-agent @ git+https://github.com/The-PR-Agent/pr-agent.git@${PR_AGENT_SOURCE_COMMIT}"

      - name: Review with PR-Agent through OpenRouter
        id: pr-agent-free
        if: steps.route.outputs.route == 'solution' && steps.preflight.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: python -m pr_agent.cli --pr_url "$PR_URL" review
        env:
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.issue.number) }}
          GITHUB__USER_TOKEN: ${{ github.token }}
          # PR-Agent expects the nested OpenRouter setting under this exact
          # environment name. The repository secret keeps its existing name.
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          config.model: openrouter/${{ steps.preflight.outputs.selected_model }}
          config.fallback_models: '[]'
          config.custom_model_max_tokens: "32000"
          config.max_model_tokens: ${{ env.PR_AGENT_FREE_MAX_MODEL_TOKENS }}
          config.ai_timeout: ${{ env.PR_AGENT_REQUEST_TIMEOUT_SECONDS }}
          config.reasoning_effort: medium
          pr_reviewer.enable_large_pr_chunking: "true"
          pr_reviewer.max_number_of_calls: ${{ env.PR_AGENT_FREE_MAX_CALLS }}
          config.duplicate_examples: "true"
          config.num_retries: "0"
          config.retry_same_model_on_timeout: "false"
          config.output_run_details: "true"
          config.output_run_cost: "true"
          config.propagate_tool_errors: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'

      - name: Check free-route publication
        id: free-publication
        if: always() && steps.route.outputs.route == 'solution'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v8
        env:
          ATTEMPT_STARTED_AT: ${{ steps.attempt.outputs.started_at }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const startedAt = Date.parse(process.env.ATTEMPT_STARTED_AT);
            const allowedAuthors = new Set(['github-actions[bot]', 'github-actions']);
            const failureMarkers = [
              'failed to review pr',
              'failed to review pull request',
              'review could not be generated',
            ];
            const reviewMarkers = ['pr reviewer guide', 'bounded openrouter reviewer guide'];
            const sources = [
              [github.rest.issues.listComments, {owner, repo, issue_number: pull_number}],
              [github.rest.pulls.listReviews, {owner, repo, pull_number}],
              [github.rest.pulls.listReviewComments, {owner, repo, pull_number}],
            ];
            const records = [];
            for (const [endpoint, parameters] of sources) {
              records.push(...await github.paginate(endpoint, {...parameters, per_page: 100}));
            }
            const produced = records.some(record => {
              if (!allowedAuthors.has((record.user?.login || '').toLowerCase())) return false;
              const observedAt = record.updated_at || record.submitted_at;
              if (!observedAt || Date.parse(observedAt) < startedAt) return false;
              const body = (record.body || '').trim();
              const normalized = body.toLowerCase().replace(/\s+/g, ' ');
              return body.length >= 80 &&
                reviewMarkers.some(marker => normalized.includes(marker)) &&
                !failureMarkers.some(marker => normalized.includes(marker));
            });
            core.setOutput('produced', String(produced));

      - name: Review with metered OpenAI fallback
        id: pr-agent-openai
        if: always() && steps.route.outputs.route == 'solution' && steps.free-publication.outputs.produced != 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: python -m pr_agent.cli --pr_url "$PR_URL" review
        env:
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.issue.number) }}
          GITHUB__USER_TOKEN: ${{ github.token }}
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          config.model: ${{ env.PR_AGENT_OPENAI_FALLBACK_MODEL }}
          config.fallback_models: '[]'
          config.custom_model_max_tokens: "256000"
          config.max_model_tokens: ${{ env.PR_AGENT_OPENAI_MAX_MODEL_TOKENS }}
          config.ai_timeout: ${{ env.PR_AGENT_REQUEST_TIMEOUT_SECONDS }}
          config.reasoning_effort: medium
          pr_reviewer.enable_large_pr_chunking: "true"
          pr_reviewer.max_number_of_calls: "3"
          config.duplicate_examples: "true"
          config.num_retries: "0"
          config.retry_same_model_on_timeout: "false"
          config.output_run_details: "true"
          config.output_run_cost: "true"
          config.propagate_tool_errors: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'

      - name: Verify substantive review publication
        if: always() && steps.route.outputs.route == 'solution'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v8
        env:
          FREE_ACTION_OUTCOME: ${{ steps.pr-agent-free.outcome }}
          FREE_REVIEW_PRODUCED: ${{ steps.free-publication.outputs.produced }}
          FALLBACK_ACTION_OUTCOME: ${{ steps.pr-agent-openai.outcome }}
          ATTEMPT_STARTED_AT: ${{ steps.attempt.outputs.started_at }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          SELECTED_FREE_MODEL: ${{ steps.preflight.outputs.selected_model }}
          FREE_MODEL_POOL: ${{ env.PR_AGENT_FREE_MODEL_POOL }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PREFLIGHT_QUALIFIED: ${{ steps.preflight.outputs.qualified }}
          PREFLIGHT_TESTED_COUNT: ${{ steps.preflight.outputs.tested_count }}
          PREFLIGHT_ELIGIBLE_COUNT: ${{ steps.preflight.outputs.eligible_count }}
          PREFLIGHT_RECEIPT_SHA256: ${{ steps.preflight.outputs.receipt_sha256 }}
          FALLBACK_MODELS: ${{ env.PR_AGENT_FALLBACK_MODELS }}
          REQUEST_TIMEOUT_SECONDS: ${{ env.PR_AGENT_REQUEST_TIMEOUT_SECONDS }}
          FREE_MAX_MODEL_TOKENS: ${{ env.PR_AGENT_FREE_MAX_MODEL_TOKENS }}
          FREE_MAX_CALLS: ${{ env.PR_AGENT_FREE_MAX_CALLS }}
          OPENAI_MAX_MODEL_TOKENS: ${{ env.PR_AGENT_OPENAI_MAX_MODEL_TOKENS }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const startedAt = Date.parse(process.env.ATTEMPT_STARTED_AT);
            const freeActionOutcome = process.env.FREE_ACTION_OUTCOME;
            const freeReviewProduced = process.env.FREE_REVIEW_PRODUCED === 'true';
            const fallbackActionOutcome = process.env.FALLBACK_ACTION_OUTCOME || 'not_invoked';
            const fallbackInvoked = !freeReviewProduced;
            const actionOutcome = freeReviewProduced ? freeActionOutcome : fallbackActionOutcome;
            let preflight = null;
            try {
              preflight = JSON.parse(fs.readFileSync('pr-agent-preflight.json', 'utf8'));
            } catch (error) {
              preflight = {
                status: 'receipt_unavailable',
                failure_reason: error.name || 'PreflightReceiptError',
              };
            }
            const failureMarkers = [
              'failed to review pr',
              'failed to review pull request',
              'review could not be generated',
            ];
            const reviewMarkers = ['pr reviewer guide', 'bounded openrouter reviewer guide'];
            const allowedAuthors = new Set(['github-actions[bot]', 'github-actions']);
            const sources = [
              ['issue_comment', github.rest.issues.listComments, {owner, repo, issue_number: pull_number}],
              ['review', github.rest.pulls.listReviews, {owner, repo, pull_number}],
              ['inline_comment', github.rest.pulls.listReviewComments, {owner, repo, pull_number}],
            ];
            const records = [];
            let apiErrorType = null;
            let pullHeadSha = null;
            try {
              const {data: pull} = await github.rest.pulls.get({owner, repo, pull_number});
              pullHeadSha = pull.head.sha;
              for (const [kind, endpoint, parameters] of sources) {
                const values = await github.paginate(endpoint, {...parameters, per_page: 100});
                records.push(...values.map(value => ({...value, kind})));
              }
            } catch (error) {
              apiErrorType = error.name || 'GitHubApiError';
            }
            const substantive = [];
            const failures = [];
            for (const record of records) {
              if (!allowedAuthors.has((record.user?.login || '').toLowerCase())) continue;
              const observedAt = record.updated_at || record.submitted_at;
              if (!observedAt || Date.parse(observedAt) < startedAt) continue;
              const body = (record.body || '').trim();
              const normalized = body.toLowerCase().replace(/\s+/g, ' ');
              const modelMatch = body.match(/(?:^|\n)- Model:\s+`?([^\s`(]+)`?(?:\s+\(([^)]+)\))?/i);
              const evidence = {
                kind: record.kind,
                id: record.id,
                url: record.html_url,
                observed_at: observedAt,
                body_sha256: crypto.createHash('sha256').update(body).digest('hex'),
                body_length: body.length,
                selected_model: modelMatch?.[1] || null,
                route_role: modelMatch?.[2] || null,
              };
              if (failureMarkers.some(marker => normalized.includes(marker))) failures.push(evidence);
              else if (
                body.length >= 80 &&
                (reviewMarkers.some(marker => normalized.includes(marker)) ||
                  record.kind === 'inline_comment')
              ) substantive.push(evidence);
            }
            const latestSubstantiveAt = Math.max(
              ...substantive.map(item => Date.parse(item.observed_at)),
              0,
            );
            const activeFailures = failures.filter(
              item => Date.parse(item.observed_at) > latestSubstantiveAt,
            );
            const produced = substantive.length > 0 && activeFailures.length === 0 && !apiErrorType;
            const observedModels = [...new Set(
              substantive.map(item => item.selected_model).filter(Boolean)
            )];
            const receipt = {
              schema_version: 'safe2.pr-agent-execution.v2',
              created_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              pr_number: pull_number,
              head_sha: pullHeadSha,
              run_id: context.runId,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              started_at: process.env.ATTEMPT_STARTED_AT,
              action_outcome: actionOutcome,
              status: produced ? 'review_produced' : 'review_unavailable',
              provider_policy: {
                free_model_pool: JSON.parse(process.env.FREE_MODEL_POOL),
                selected_free_model: process.env.SELECTED_FREE_MODEL || null,
                fallback_models: JSON.parse(process.env.FALLBACK_MODELS),
                request_timeout_seconds: Number(process.env.REQUEST_TIMEOUT_SECONDS),
                free_max_model_tokens: Number(process.env.FREE_MAX_MODEL_TOKENS),
                free_max_number_of_calls: Number(process.env.FREE_MAX_CALLS),
                free_coverage_mode: 'pr_agent_full_diff_single_pass',
                openai_max_model_tokens: Number(process.env.OPENAI_MAX_MODEL_TOKENS),
              },
              provider_execution: {
                preflight_outcome: process.env.PREFLIGHT_OUTCOME,
                preflight_qualified: process.env.PREFLIGHT_QUALIFIED === 'true',
                preflight_tested_count: Number(process.env.PREFLIGHT_TESTED_COUNT || 0),
                preflight_eligible_count: Number(process.env.PREFLIGHT_ELIGIBLE_COUNT || 0),
                preflight_receipt_sha256: process.env.PREFLIGHT_RECEIPT_SHA256 || null,
                free_action_outcome: freeActionOutcome,
                free_review_produced: freeReviewProduced,
                fallback_invoked: fallbackInvoked,
                fallback_action_outcome: fallbackActionOutcome,
                selected_models: observedModels,
                final_model: observedModels.at(-1) ||
                  (freeReviewProduced ? process.env.SELECTED_FREE_MODEL : null),
              },
              preflight,
              publication: {
                substantive_count: substantive.length,
                failure_count: failures.length,
                active_failure_count: activeFailures.length,
                substantive,
                failures,
              },
              api_error_type: apiErrorType,
              advisory_only: true,
              merge_authorized: false,
            };
            fs.writeFileSync('pr-agent-execution.json', `${JSON.stringify(receipt, null, 2)}\n`);
            await core.summary
              .addHeading('PR-Agent execution truth')
              .addList([
                `Status: **${receipt.status}**`,
                `Substantive review publications: **${substantive.length}**`,
                `Explicit failure publications: **${failures.length}**`,
                `Action outcome: **${actionOutcome}**`,
                `Free-route outcome: **${freeActionOutcome}**`,
                `Metered fallback invoked: **${fallbackInvoked ? 'yes' : 'no'}**`,
                `Fallback outcome: **${fallbackActionOutcome}**`,
                `Free models tested: **${receipt.provider_execution.preflight_tested_count}** of **${receipt.provider_execution.preflight_eligible_count}** currently eligible`,
                `Live health shortlist: ${Array.isArray(receipt.preflight.shortlisted_candidates) && receipt.preflight.shortlisted_candidates.length ? receipt.preflight.shortlisted_candidates.map(model => `\`${model}\``).join(' → ') : '**none**'}`,
                `Selected free model: ${receipt.provider_policy.selected_free_model ? `\`${receipt.provider_policy.selected_free_model}\`` : '**none**'}`,
                `Preflight status: **${receipt.preflight.status}**`,
                `Preflight qualification: **${receipt.provider_execution.preflight_qualified ? 'qualified' : 'degraded or unavailable'}**`,
                `Fallback order: ${receipt.provider_policy.fallback_models.map(model => `\`${model}\``).join(' → ')}`,
                `Per-route timeout: **${receipt.provider_policy.request_timeout_seconds}s**`,
                `Free review budget: **${receipt.provider_policy.free_max_model_tokens} tokens**`,
                `OpenAI fallback budget: **${receipt.provider_policy.openai_max_model_tokens} tokens**`,
                `Observed responding model: ${receipt.provider_execution.final_model ? `\`${receipt.provider_execution.final_model}\`` : '**not reported**'}`,
                'Authority: advisory only; deterministic checks and human review remain authoritative.',
                ...(produced ? [] : ['Result: reviewer unavailable. This is not approval and this check is not a merge requirement.']),
              ])
              .write();
            if (!produced) core.setFailed('PR-Agent did not publish a substantive review; see execution receipt.');

      - name: Retain PR-Agent execution receipt
        if: always() && steps.route.outputs.route == 'solution'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-agent-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pr-agent-preflight.json
            pr-agent-execution.json
          if-no-files-found: error
          retention-days: 90
