name: PR-Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Keep unrelated PR comments from cancelling an active review. Only pull-request
  # events and explicit /review commands share the review concurrency lane.
  group: >-
    pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{
      github.event_name == 'issue_comment' &&
      !startsWith(github.event.comment.body, '/review') &&
      github.run_id || 'review'
    }}
  cancel-in-progress: true

jobs:
  review:
    name: PR-Agent / Advisory availability
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_AGENT_PRIMARY_MODEL: openrouter/qwen/qwen3.8-27b:free
      PR_AGENT_FALLBACK_MODELS: '["openrouter/cohere/north-mini-code:free", "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free", "gpt-5.6-luna"]'
      PR_AGENT_REQUEST_TIMEOUT_SECONDS: "75"
      PR_AGENT_MAX_MODEL_TOKENS: "64000"
    steps:
      - name: Record review attempt start
        id: attempt
        shell: bash
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Review pull request
        id: pr-agent
        continue-on-error: true
        uses: the-pr-agent/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975 # v0.46.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          config.model: ${{ env.PR_AGENT_PRIMARY_MODEL }}
          config.fallback_models: ${{ env.PR_AGENT_FALLBACK_MODELS }}
          config.custom_model_max_tokens: "256000"
          config.max_model_tokens: ${{ env.PR_AGENT_MAX_MODEL_TOKENS }}
          config.ai_timeout: ${{ env.PR_AGENT_REQUEST_TIMEOUT_SECONDS }}
          config.reasoning_effort: medium
          config.duplicate_examples: "true"
          config.num_retries: "0"
          config.retry_same_model_on_timeout: "false"
          config.output_run_details: "true"
          config.output_run_cost: "true"
          config.propagate_tool_errors: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'

      - name: Verify substantive review publication
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v8
        env:
          ACTION_OUTCOME: ${{ steps.pr-agent.outcome }}
          ATTEMPT_STARTED_AT: ${{ steps.attempt.outputs.started_at }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PRIMARY_MODEL: ${{ env.PR_AGENT_PRIMARY_MODEL }}
          FALLBACK_MODELS: ${{ env.PR_AGENT_FALLBACK_MODELS }}
          REQUEST_TIMEOUT_SECONDS: ${{ env.PR_AGENT_REQUEST_TIMEOUT_SECONDS }}
          MAX_MODEL_TOKENS: ${{ env.PR_AGENT_MAX_MODEL_TOKENS }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const startedAt = Date.parse(process.env.ATTEMPT_STARTED_AT);
            const actionOutcome = process.env.ACTION_OUTCOME;
            const failureMarkers = [
              'failed to review pr',
              'failed to review pull request',
              'review could not be generated',
            ];
            const allowedAuthors = new Set(['github-actions[bot]', 'github-actions']);
            const sources = [
              ['issue_comment', github.rest.issues.listComments, {owner, repo, issue_number: pull_number}],
              ['review', github.rest.pulls.listReviews, {owner, repo, pull_number}],
              ['inline_comment', github.rest.pulls.listReviewComments, {owner, repo, pull_number}],
            ];
            const records = [];
            let apiErrorType = null;
            let pullHeadSha = null;
            try {
              const {data: pull} = await github.rest.pulls.get({owner, repo, pull_number});
              pullHeadSha = pull.head.sha;
              for (const [kind, endpoint, parameters] of sources) {
                const values = await github.paginate(endpoint, {...parameters, per_page: 100});
                records.push(...values.map(value => ({...value, kind})));
              }
            } catch (error) {
              apiErrorType = error.name || 'GitHubApiError';
            }
            const substantive = [];
            const failures = [];
            for (const record of records) {
              if (!allowedAuthors.has((record.user?.login || '').toLowerCase())) continue;
              const observedAt = record.updated_at || record.submitted_at;
              if (!observedAt || Date.parse(observedAt) < startedAt) continue;
              const body = (record.body || '').trim();
              const normalized = body.toLowerCase().replace(/\s+/g, ' ');
              const modelMatch = body.match(/(?:^|\n)- Model:\s+`?([^\s`(]+)`?(?:\s+\(([^)]+)\))?/i);
              const evidence = {
                kind: record.kind,
                id: record.id,
                url: record.html_url,
                observed_at: observedAt,
                body_sha256: crypto.createHash('sha256').update(body).digest('hex'),
                body_length: body.length,
                selected_model: modelMatch?.[1] || null,
                route_role: modelMatch?.[2] || null,
              };
              if (failureMarkers.some(marker => normalized.includes(marker))) failures.push(evidence);
              else if (
                body.length >= 80 &&
                (normalized.includes('pr reviewer guide') || record.kind === 'inline_comment')
              ) substantive.push(evidence);
            }
            const produced = (
              actionOutcome === 'success' &&
              substantive.length > 0 &&
              failures.length === 0 &&
              !apiErrorType
            );
            const observedModels = [...new Set(
              substantive.map(item => item.selected_model).filter(Boolean)
            )];
            const receipt = {
              schema_version: 'safe2.pr-agent-execution.v2',
              created_at: new Date().toISOString(),
              repository: `${owner}/${repo}`,
              pr_number: pull_number,
              head_sha: pullHeadSha,
              run_id: context.runId,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              started_at: process.env.ATTEMPT_STARTED_AT,
              action_outcome: actionOutcome,
              status: produced ? 'review_produced' : 'review_unavailable',
              provider_policy: {
                primary_model: process.env.PRIMARY_MODEL,
                fallback_models: JSON.parse(process.env.FALLBACK_MODELS),
                request_timeout_seconds: Number(process.env.REQUEST_TIMEOUT_SECONDS),
                max_model_tokens: Number(process.env.MAX_MODEL_TOKENS),
              },
              provider_execution: {
                selected_models: observedModels,
                final_model: observedModels.at(-1) || null,
              },
              publication: {
                substantive_count: substantive.length,
                failure_count: failures.length,
                substantive,
                failures,
              },
              api_error_type: apiErrorType,
              advisory_only: true,
              merge_authorized: false,
            };
            fs.writeFileSync('pr-agent-execution.json', `${JSON.stringify(receipt, null, 2)}\n`);
            await core.summary
              .addHeading('PR-Agent execution truth')
              .addList([
                `Status: **${receipt.status}**`,
                `Substantive review publications: **${substantive.length}**`,
                `Explicit failure publications: **${failures.length}**`,
                `Action outcome: **${actionOutcome}**`,
                `Primary model: \`${receipt.provider_policy.primary_model}\``,
                `Fallback order: ${receipt.provider_policy.fallback_models.map(model => `\`${model}\``).join(' → ')}`,
                `Per-route timeout: **${receipt.provider_policy.request_timeout_seconds}s**`,
                `Context budget: **${receipt.provider_policy.max_model_tokens} tokens**`,
                `Observed responding model: ${receipt.provider_execution.final_model ? `\`${receipt.provider_execution.final_model}\`` : '**not reported**'}`,
                'Authority: advisory only; deterministic checks and human review remain authoritative.',
                ...(produced ? [] : ['Result: reviewer unavailable. This is not approval and this check is not a merge requirement.']),
              ])
              .write();
            if (!produced) core.setFailed('PR-Agent did not publish a substantive review; see execution receipt.');

      - name: Retain PR-Agent execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-agent-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-agent-execution.json
          if-no-files-found: error
          retention-days: 90
