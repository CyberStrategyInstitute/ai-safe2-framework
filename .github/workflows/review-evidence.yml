name: Review Decision Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: AI SAFE2 / Decision evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install released AI SAFE2 CLI
        run: python -m pip install "ai-safe2==0.9.0"

      - name: Capture comparable AI SAFE2 environment evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/review-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          git checkout --detach "$BASE_SHA"
          safe2 doctor . --no-wsl --assess --assets --hash-assets --output "$EVIDENCE_DIR/ai-safe2-baseline.json"
          git checkout --detach "$HEAD_SHA"
          safe2 doctor . --no-wsl --assess --assets --hash-assets \
            --baseline "$EVIDENCE_DIR/ai-safe2-baseline.json" \
            --output "$EVIDENCE_DIR/ai-safe2-current.json"
          safe2 --version > "$EVIDENCE_DIR/cli-version.txt"

      - name: Build reviewer decision record
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVIDENCE_DIR: ${{ runner.temp }}/review-evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_review_evidence.py \
            --policy .ai-safe2/review-policy.json \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" --pull-request "$PR_NUMBER" \
            --safe2-evidence "$EVIDENCE_DIR/ai-safe2-current.json" --safe2-version "$(cat "$EVIDENCE_DIR/cli-version.txt")" \
            --check "ai-safe2-environment=passed=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --json-output "$EVIDENCE_DIR/review-evidence.json" \
            --markdown-output "$EVIDENCE_DIR/review-decision.md"
          cat "$EVIDENCE_DIR/review-decision.md" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$EVIDENCE_DIR"/* > "$EVIDENCE_DIR/SHA256SUMS"

      - name: Retain before, after, and decision evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-evidence-${{ github.event.pull_request.number || github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/review-evidence/
          retention-days: 90
          if-no-files-found: error
