name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "NEXUS/sdk/python/**"
      - "NEXUS/opa/**"
      - "NEXUS/schemas/**"
      - "NEXUS/compliance/**"
      - "NEXUS/examples/**"
      - "scanner/**"
      - "skills/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # NEXUS Python SDK tests: Python 3.10, 3.11, 3.12
  # --------------------------------------------------------------------------
  test:
    name: NEXUS Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: NEXUS/sdk/python/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r NEXUS/sdk/python/requirements.txt pytest-cov

      - name: Run tests
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: |
          python -m pytest NEXUS/sdk/python/tests/ -v --tb=short --cov=nexus_sdk \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # --------------------------------------------------------------------------
  # NEXUS v0.3 implementation checks under the AI SAFE2 v3.1 release context
  # --------------------------------------------------------------------------
  compliance:
    name: AI SAFE2 v3.1 / NEXUS v0.3 Compliance
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: NEXUS/sdk/python/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r NEXUS/sdk/python/requirements.txt

      - name: Run NEXUS v0.3 compliance checks
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: |
          python NEXUS/compliance/scoring/nexus-score.py --v03-checks
          python NEXUS/compliance/scoring/nexus-score.py --check-env

  # --------------------------------------------------------------------------
  # Lint maintained Python implementation surfaces
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff>=0.4.0"

      - name: Ruff check
        run: ruff check NEXUS/sdk/python/nexus_sdk/ NEXUS/sdk/python/tests/ NEXUS/examples/ scanner/ skills/mcp/src/ scripts/

  # --------------------------------------------------------------------------
  # Dash guard for maintained executable/configuration surfaces.
  # Historical prose is intentionally excluded because original research and
  # example publication language is preserved as provenance.
  # --------------------------------------------------------------------------
  em-dash-guard:
    name: No Em Dashes in Maintained Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan maintained code for Unicode dashes
        run: |
          echo "Scanning maintained code for em dashes (U+2014) and en dashes (U+2013)..."
          FOUND=$(grep -rn $'\xe2\x80\x94\|\xe2\x80\x93' \
            --include="*.py" --include="*.rego" --include="*.toml" \
            --include="*.yaml" --include="*.yml" --include="*.json" \
            NEXUS scanner skills/mcp/src scripts .github/workflows 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: em/en dashes found in maintained code/config. Use ASCII punctuation."
            echo "$FOUND"
            exit 1
          fi
          echo "Clean: no em/en dashes found in maintained code/config."

  # --------------------------------------------------------------------------
  # NEXUS reference examples (smoke test)
  # --------------------------------------------------------------------------
  examples:
    name: NEXUS Examples Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: NEXUS/sdk/python/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r NEXUS/sdk/python/requirements.txt

      - name: sovereign_gateway.py
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: python NEXUS/examples/sovereign_gateway.py

      - name: acs_bridge.py
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: python NEXUS/examples/acs_bridge.py

      - name: personal_agent.py
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: python NEXUS/examples/personal_agent.py

  # --------------------------------------------------------------------------
  # Schema validation (all NEXUS JSON schemas must parse as JSON)
  # --------------------------------------------------------------------------
  schema-lint:
    name: NEXUS Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate JSON schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("NEXUS/schemas").glob("*.json"))
          if not schemas:
              raise SystemExit("ERROR: no NEXUS JSON schemas found")
          for path in schemas:
              print(f"Validating {path}...")
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print("  OK")
          print(f"Validated {len(schemas)} NEXUS schema(s).")
          PY
