name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "NEXUS/sdk/python/**"
      - "NEXUS/opa/**"
      - "NEXUS/schemas/**"
      - "NEXUS/compliance/**"
      - "NEXUS/examples/**"
      - "scanner/**"
      - "safe2/**"
      - "aisafe2_mcp_tools/**"
      - "tests/**"
      - "AISM/**"
      - "00-cross-pillar/unbiased-ai/**"
      - "skills/**"
      - "examples/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - "ai-safe2.manifest.json"
      - "scripts/check_agent_manifest.py"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe2-cli:
    name: SAFE2 CLI / AISM (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SAFE2 and test dependencies
        run: python -m pip install ".[all,dev]" build

      - name: Run SAFE2 tests
        run: python -m pytest tests/ scanner/tests/ -v --tb=short

      - name: Validate agent manifest and UAS profile
        run: python scripts/check_agent_manifest.py

      - name: Verify the AISM Decision Card example
        run: |
          safe2 example verify aism-decision-card
          python examples/aism-decision-card/smoke_test.py

      - name: Build distribution
        run: python -m build

  test:
    name: NEXUS Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: NEXUS/sdk/python/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r NEXUS/sdk/python/requirements.txt pytest-cov

      - name: Run tests
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: |
          python -m pytest NEXUS/sdk/python/tests/ -v --tb=short --cov=nexus_sdk \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  compliance:
    name: AI SAFE2 v3.1 / NEXUS v0.3 Compliance
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: NEXUS/sdk/python/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r NEXUS/sdk/python/requirements.txt

      - name: Run NEXUS v0.3 compliance checks
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: |
          python NEXUS/compliance/scoring/nexus-score.py --v03-checks
          python NEXUS/compliance/scoring/nexus-score.py --check-env

  lint:
    name: Python Correctness Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff>=0.4.0"

      - name: Check release-critical Python correctness
        run: |
          ruff check \
            --select E9,F63,F7,F82 \
            NEXUS/sdk/python/nexus_sdk/ \
            NEXUS/sdk/python/tests/ \
            NEXUS/examples/ \
            scanner/ \
            safe2/ \
            aisafe2_mcp_tools/ \
            tests/ \
            skills/mcp/src/ \
            scripts/

  examples:
    name: NEXUS Examples Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: NEXUS/sdk/python/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r NEXUS/sdk/python/requirements.txt

      - name: sovereign_gateway.py
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: python NEXUS/examples/sovereign_gateway.py

      - name: acs_bridge.py
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: python NEXUS/examples/acs_bridge.py

      - name: personal_agent.py
        env:
          PYTHONPATH: NEXUS/sdk/python
        run: python NEXUS/examples/personal_agent.py

  schema-lint:
    name: NEXUS Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate JSON schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("NEXUS/schemas").glob("*.json"))
          if not schemas:
              raise SystemExit("ERROR: no NEXUS JSON schemas found")
          for path in schemas:
              print(f"Validating {path}...")
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print("  OK")
          print(f"Validated {len(schemas)} NEXUS schema(s).")
          PY
