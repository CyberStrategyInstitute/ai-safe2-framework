name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        env:
          # Apply the repository's reviewed CodeQL model pack (declared sanitizers,
          # see .github/codeql/extensions/safe2-log-models). Python only. If this
          # wiring ever stops working, the affected alerts reappear rather than hide.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            ${{ matrix.language == 'python' && format('{{"database":{{"run-queries":["--additional-packs={0}/.github/codeql/extensions","--model-packs=cyberstrategyinstitute/safe2-log-models"]}}}}', github.workspace) || '' }}
        with:
          category: /language:${{ matrix.language }}
