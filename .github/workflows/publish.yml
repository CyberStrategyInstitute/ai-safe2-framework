name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # Required for OIDC trusted publishing (no API key needed)

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine ".[all,dev]"

      - name: Read package version
        id: package
        shell: bash
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package version
        run: python scripts/check_release_installation.py --expected-version "${{ steps.package.outputs.version }}" --check-tag "$GITHUB_REF_NAME"

      - name: Run tests before publish
        run: python -m pytest tests/ scanner/tests/ -q

      - name: Run release invariants before publish
        run: |
          python scripts/check_agent_manifest.py
          safe2 example verify aism-decision-card
          python examples/aism-decision-card/smoke_test.py
          safe2 example verify environment-decision-card
          python examples/environment-decision-card/smoke_test.py

      - name: Build wheel and sdist
        run: python -m build --outdir dist/

      - name: Verify distribution
        run: |
          python -m twine check dist/*
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-smoke/bin/safe2" --version
          "$GITHUB_WORKSPACE/wheel-smoke/bin/python" -m safe2 --version
          "$GITHUB_WORKSPACE/wheel-smoke/bin/safe2" example verify aism-decision-card
          "$GITHUB_WORKSPACE/wheel-smoke/bin/safe2" example verify environment-decision-card
          "$GITHUB_WORKSPACE/wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_release_installation.py" --expected-version "${{ steps.package.outputs.version }}"

      - name: Build release decision evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          BASE_REV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-parse HEAD^)"
          safe2 doctor . --no-wsl --assess --assets --hash-assets --output release-evidence/ai-safe2-environment.json
          python scripts/build_review_evidence.py \
            --policy .ai-safe2/review-policy.json --base "$BASE_REV" --head HEAD \
            --repository "$GITHUB_REPOSITORY" --safe2-version "$(safe2 --version)" \
            --safe2-evidence release-evidence/ai-safe2-environment.json \
            --check "full-tests=passed=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --check "installed-wheel=passed=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --check "release-invariants=passed=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --json-output release-evidence/release-review-evidence.json \
            --markdown-output release-evidence/release-decision.md \
            --decision-request-output release-evidence/decision-request.json
          python -m safe2 decision evaluate release-evidence/decision-request.json \
            --output release-evidence/decision-gateway.json \
            --ledger release-evidence/decision-ledger.jsonl
          python -m safe2 decision replay .ai-safe2/decision-evals \
            --output release-evidence/decision-replay.json
          sha256sum dist/* release-evidence/*.json release-evidence/*.md > release-evidence/SHA256SUMS
          cat release-evidence/release-decision.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - name: Upload release decision evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 365
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v') && github.event.release.prerelease == false
    environment:
      name: pypi
      url: https://pypi.org/project/ai-safe2/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # No API token needed -- uses OIDC trusted publishing
        # Configure at: https://pypi.org/manage/project/ai-safe2/settings/publishing/

  publish-testpypi:
    name: Publish to TestPyPI (pre-release)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v') && github.event.release.prerelease == true
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ai-safe2/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
