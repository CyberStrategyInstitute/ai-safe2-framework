name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # Required for OIDC trusted publishing (no API key needed)

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine ".[all,dev]"

      - name: Run tests before publish
        run: python -m pytest tests/ scanner/tests/ -q

      - name: Run release invariants before publish
        run: |
          python scripts/check_agent_manifest.py
          safe2 example verify aism-decision-card
          python examples/aism-decision-card/smoke_test.py
          safe2 example verify environment-decision-card
          python examples/environment-decision-card/smoke_test.py

      - name: Build wheel and sdist
        run: python -m build --outdir dist/

      - name: Verify distribution
        run: |
          python -m twine check dist/*
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-smoke/bin/safe2" --version
          "$GITHUB_WORKSPACE/wheel-smoke/bin/python" -m safe2 --version
          "$GITHUB_WORKSPACE/wheel-smoke/bin/safe2" example verify aism-decision-card
          "$GITHUB_WORKSPACE/wheel-smoke/bin/safe2" example verify environment-decision-card

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    environment:
      name: pypi
      url: https://pypi.org/project/ai-safe2/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed -- uses OIDC trusted publishing
        # Configure at: https://pypi.org/manage/project/ai-safe2/settings/publishing/

  publish-testpypi:
    name: Publish to TestPyPI (pre-release)
    needs: build
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == true
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ai-safe2/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
