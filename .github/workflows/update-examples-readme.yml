name: Update Examples Table

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "scripts/generate_examples_table.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-examples-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Do not persist credentials while a repository-controlled generator runs.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Regenerate examples index
        run: python scripts/generate_examples_table.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- examples/README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated examples index
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.README_BOT_PAT }}
          commit-message: "chore: auto-update examples index"
          title: "chore: auto-update examples index"
          body: |
            Auto-generated by `scripts/generate_examples_table.py` after a
            change under `examples/**`. Merges once required checks pass.
          branch: bot/update-examples-table
          delete-branch: true

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.README_BOT_PAT }}
        run: gh pr merge bot/update-examples-table --squash --auto
