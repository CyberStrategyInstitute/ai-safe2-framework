name: Update Examples Table

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "scripts/generate_examples_table.py"
  workflow_dispatch: {}

# The default GITHUB_TOKEN needs nothing here — all writes go through the PAT,
# which is scoped to exactly the two steps that need it. Do not widen this.
permissions:
  contents: read

# Two rapid pushes to examples/** must not race each other onto the same
# bot/update-examples-table branch mid-create/merge/delete cycle.
concurrency:
  group: update-examples-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # CRITICAL: never persist credentials into .git/config here.
          # The next step executes scripts/generate_examples_table.py — a file
          # that is itself in this workflow's trigger paths. With persisted
          # credentials, anyone who lands a change to that script gets code
          # execution on main with the PAT readable from the workspace.
          # The PAT is injected ONLY into the two steps below that need it.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate examples table
        run: python scripts/generate_examples_table.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated table
        if: steps.diff.outputs.changed == 'true'
        # SHA-pinned: this third-party action receives the PAT. A moved tag
        # must never be able to swap the code that handles that credential.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # PAT required: the default GITHUB_TOKEN cannot trigger other
          # workflows (markdown-lint, check-examples-table) on PRs it opens,
          # so required checks would never run and the PR could never merge.
          # Use a fine-grained PAT scoped to THIS repo only, with
          # Contents: read/write + Pull requests: read/write. Never a classic
          # PAT — classic scope covers every repo the bot account can write.
          token: ${{ secrets.README_BOT_PAT }}
          commit-message: "chore: auto-update examples table"
          title: "chore: auto-update examples table"
          body: |
            Auto-generated by `scripts/generate_examples_table.py` after a
            change under `examples/**`. Merges once required checks pass.
          branch: bot/update-examples-table
          delete-branch: true

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.README_BOT_PAT }}
        # No `|| true`: if repo auto-merge is disabled or branch protection
        # rejects the request, this must fail loudly. A silently-stranded bot
        # PR is a pipeline you believe works and doesn't.
        run: gh pr merge bot/update-examples-table --squash --auto
