name: Update Examples Table

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "scripts/generate_examples_table.py"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Use the PAT here too, not just below, so this branch's later
          # push in create-pull-request authenticates as a real account.
          token: ${{ secrets.README_BOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate examples table
        run: python scripts/generate_examples_table.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated table
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # PAT required here. The default GITHUB_TOKEN cannot trigger
          # other workflows (markdown-lint, check-examples-table) on PRs
          # it opens, so those required checks would never run and the
          # PR could never merge.
          token: ${{ secrets.README_BOT_PAT }}
          commit-message: "chore: auto-update examples table"
          title: "chore: auto-update examples table"
          body: |
            Auto-generated by `scripts/generate_examples_table.py` after a
            change under `examples/**`. Merges once required checks pass.
          branch: bot/update-examples-table
          delete-branch: true

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.README_BOT_PAT }}
        run: |
          gh pr merge bot/update-examples-table --squash --auto || true
