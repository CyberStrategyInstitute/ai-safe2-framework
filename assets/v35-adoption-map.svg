<text x="449" y="154" fill="#f7fafc" font-family="Arial,sans-serif" font-size="18">Gateways, NEXUS and examples</text>
<text x="449" y="196" fill="#f7fafc" font-family="Arial,sans-serif" font-size="18">Skills and MCP knowledge access</text>
