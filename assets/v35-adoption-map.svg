<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">AI SAFE2 v3.5 adoption map</title>
<desc id="desc">Define requirements, build the applicable control boundary, then verify effects and retain human authority. Source requirements and tools do not establish deployed conformance.</desc>
