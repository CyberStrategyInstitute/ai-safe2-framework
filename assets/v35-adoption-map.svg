<text x="52" y="154" fill="#f7fafc" font-family="Arial,sans-serif" font-size="18">157 child clauses</text>
<text x="52" y="196" fill="#f7fafc" font-family="Arial,sans-serif" font-size="18">19 MCP controls + 12 child clauses</text>
