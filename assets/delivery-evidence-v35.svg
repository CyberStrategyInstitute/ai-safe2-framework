<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="275" viewBox="0 0 1200 275" role="img" aria-labelledby="title desc">
<title id="title">Build with criteria and evidence</title>
<desc id="desc">Plans, reviews and receipts support decisions. They do not authorize deployment.</desc>
<rect width="1200" height="275" rx="18" fill="#10131c"/>
<text x="24" y="40" font-size="24" font-family="Arial,sans-serif" fill="#edf2f7">Build with criteria and evidence</text>
<rect x="24" y="65" width="258" height="133" rx="12" fill="#1c2230" stroke="#f6921e" stroke-width="2"/>
<text x="40" y="105" font-size="20" font-family="Arial,sans-serif" fill="#f6921e">DEFINE</text>
<text x="40" y="151" font-size="15" font-family="Arial,sans-serif" fill="#edf2f7">Success criteria and scope</text>
<path d="M291 130h22m-8-8 8 8-8 8" stroke="#c1ccdc" stroke-width="3" fill="none"/>
<rect x="322" y="65" width="258" height="133" rx="12" fill="#1c2230" stroke="#63b3ed" stroke-width="2"/>
<text x="338" y="105" font-size="20" font-family="Arial,sans-serif" fill="#63b3ed">BUILD</text>
<text x="338" y="151" font-size="15" font-family="Arial,sans-serif" fill="#edf2f7">Revision and bounded tests</text>
<path d="M589 130h22m-8-8 8 8-8 8" stroke="#c1ccdc" stroke-width="3" fill="none"/>
<rect x="620" y="65" width="258" height="133" rx="12" fill="#1c2230" stroke="#c4a2f2" stroke-width="2"/>
<text x="636" y="105" font-size="20" font-family="Arial,sans-serif" fill="#c4a2f2">REVIEW</text>
<text x="636" y="151" font-size="15" font-family="Arial,sans-serif" fill="#edf2f7">Results, gaps and recovery</text>
<path d="M887 130h22m-8-8 8 8-8 8" stroke="#c1ccdc" stroke-width="3" fill="none"/>
<rect x="918" y="65" width="258" height="133" rx="12" fill="#1c2230" stroke="#68d391" stroke-width="2"/>
<text x="934" y="105" font-size="20" font-family="Arial,sans-serif" fill="#68d391">DECIDE</text>
<text x="934" y="151" font-size="15" font-family="Arial,sans-serif" fill="#edf2f7">Named human authority</text>
<text x="24" y="240" font-size="16" font-family="Arial,sans-serif" fill="#c1ccdc">Plans, reviews and receipts support decisions. They do not authorize deployment.</text>
</svg>